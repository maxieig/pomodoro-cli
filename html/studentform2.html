<html>
<head>
    <title>Student Registration Form2</title>
</head>

<body>
<h2>Student Registration Form</h2>
<hr>

<form>
    <table>
        <tr>
            <td>Student Name:</td>
            <td><input type="text" name="student_name"></td>
        </tr>
        <tr>
            <td>Father Name:</td>
            <td><input type="text" name="father_name"></td>
        </tr>
        <tr>
            <td>Date Of Birth:</td>
            <td>
                Day <select name="day"><option>Choose Day</option></select>
                Month <select name="month"><option>Choose Month</option></select>
                <select name="year"><option>Choose Year</option></select>
            </td>
        </tr>
        <tr>
            <td>Phone Number:</td>
            <td>
                <select name="country_code"><option>+95</option></select>
                <input type="text" name="phone">
            </td>
        </tr>
        <tr>
            <td>Genre:</td>
            <td>
                <input type="radio" name="gender" value="male"> male
                <input type="radio" name="gender" value="female"> female
            </td>
        </tr>
        <tr>
            <td>Subjects:</td>
            <td>
                <input type="checkbox" name="maths"> Maths B
                <input type="checkbox" name="physics"> Physics
                <input type="checkbox" name="efl"> EFL
                <input type="checkbox" name="business"> Business
                <input type="checkbox" name="biology"> Biology
            </td>
        </tr>
        <tr>
            <td>Address:</td>
            <td><textarea name="address"></textarea></td>
        </tr>
        <tr>
            <td></td>
            <td><button type="submit">Register</button></td>
        </tr>
    </table>
</form>
</body>
</html>
