<html>
    <head>
        <title>SeptemberTutorial</title>
    </head>
</html>
<body>
    <h1 align="center">Connect Education Student Registration Form</h1>
    <h3>PERSONAL INFORMATION</h3>
<hr>
 <form>

        <table>

            <tr>
                <td>Surname:</td>
                <td><input type="text" size="40"></td>
            </tr>

            <tr>
                <td>Other name:</td>
                <td><input type="text" size="40"></td>
            </tr>

             <tr>
                <td>Gender</td>
                <td>
                
                    <select>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
            
            <tr>
                <td>Tel:</td>
                <td><input type="text" size="10"></td>
            </tr>

            <tr>
                <td>Email:</td>
                <td><input type="text" size="40"></td>
            </tr>

            <tr>
                <td>Subjects:</td>
                <td>
                    <input type="checkbox" name="CS"> CS
                    <input type="checkbox" name="ICT"> ICT
                    <input type="checkbox" name="ESL"> ESL
                    <input type="checkbox" name="EFL"> EFL
                    <input type="checkbox" name="EMath"> E Math
                    <input type="checkbox" name="AMath"> A Math
                    <input type="checkbox" name="Chemistry"> Chemistry
                    <input type="checkbox" name="Physic"> Physic
                    <input type="checkbox" name="Biology"> Biology
                </td>
            </tr>
            <tr>
            
                <td>
                    <input type="radio" name="schedule"> Weekday
                    <input type="radio" name="schedule"> Weekend
                </td>
            </tr>
            <tr>
                <td>Reason for registration:</td>
                <td><textarea rows="2" cols="40" placeholder="Type your reason here"></textarea></td>
            </tr>
            <tr align="center">
                <td></td>
                <td><button align="center" type="submit">Register now</button></td>
            </tr>
        </table>
    </form>
</body>
</html>
