<html>

<head>
    <title>Student Registration Form</title>
</head>

<body>

    <h2>Student's Registration Form</h2>

    <form>

        <table>

            <tr>
                <td>Student Name:</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Father Name:</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Date of Birth:</td>
                <td>
                    <label>Day</label>
                    <select>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                        <option>11</option>
                        <option>12</option>
                        <option>13</option>
                        <option>14</option>
                        <option>15</option>
                        <option>16</option>
                        <option>17</option>
                        <option>18</option>
                        <option>19</option>
                        <option>20</option>
                        <option>21</option>
                        <option>22</option>
                        <option>23</option>
                        <option>24</option>
                        <option>25</option>
                        <option>26</option>
                        <option>27</option>
                        <option>28</option>
                        <option>29</option>
                        <option>30</option>
                        <option>31</option>
                    </select>

                    <label>Month</label>
                    <select>
                        <option>January</option>
                        <option>February</option>
                        <option>March</option>
                        <option>April</option>
                        <option>May</option>
                        <option>June</option>
                        <option>July</option>
                        <option>August</option>
                        <option>September</option>
                        <option>October</option>
                        <option>November</option>
                        <option>December</option>
                    </select>

                    <label>Year</label>
                    <select>
                        <option>2000</option>
                        <option>2001</option>
                        <option>2002</option>
                        <option>2003</option>
                        <option>2004</option>
                        <option>2005</option>
                        <option>2006</option>
                        <option>2007</option>
                        <option>2008</option>
                        <option>2009</option>
                        <option>2010</option>
                        <option>2011</option>
                        <option>2012</option>
                        <option>2013</option>
                        <option>2014</option>
                        <option>2015</option>
                        <option>2016</option>
                        <option>2017</option>
                        <option>2018</option>
                        <option>2019</option>
                        <option>2020</option>
                        <option>2021</option>
                        <option>2022</option>
                        <option>2023</option>
                        <option>2024</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Phone Number:</td>
                <td>
                    <select>
                        <option>+95</option>
                        <option>+66</option>
                        <option>+60</option>
                        <option>+62</option>
                        <option>+91</option>
                        <option>+84</option>
                        <option>+81</option>
                        <option>+77</option>
                        <option>+67</option>
                        <option>+63</option>
                        <option>+94</option>
                        <option>+82</option>
                    </select>

                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>

            <tr>
                <td>Subjects:</td>
                <td>
                    <input type="checkbox"> Maths
                    <input type="checkbox"> EFL
                    <input type="checkbox"> Biology
                    <input type="checkbox"> Chemistry
                    <br>
                    <input type="checkbox"> Physics
                    <input type="checkbox"> A Maths
                    <input type="checkbox"> ICT
                    <input type="checkbox"> Business
                </td>
            </tr>

            <tr>
                <td>Address:</td>
                <td><textarea rows="4" cols="30"></textarea></td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
